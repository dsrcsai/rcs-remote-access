name: RCS Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-rcs*'

permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ github.ref_type == 'tag' && github.ref_name || 'rcs-latest' }}
      publish-update-metadata: false
